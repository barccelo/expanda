name: Build Expanda Personal APK

on:
  push:
    branches:
      - custom-development
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPANDA_CI_VERSION_CODE: ${{ github.run_number }}
  EXPANDA_CI_VERSION_NAME: 0.3.2-personal.${{ github.run_number }}

jobs:
  build:
    name: Test and build signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" || { echo "::error::Missing SIGNING_KEY repository secret"; exit 1; }
          test -n "$KEY_STORE_PASSWORD" || { echo "::error::Missing KEY_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$ALIAS" || { echo "::error::Missing ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD repository secret"; exit 1; }

      - name: Restore permanent signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/expanda-personal-signing.jks"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          cat > signing.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 signing.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Expanda-Personal.apk

      - name: Upload Expanda Personal APK
        uses: actions/upload-artifact@v4
        with:
          name: Expanda-Personal-${{ env.EXPANDA_CI_VERSION_NAME }}
          path: Expanda-Personal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${EXPANDA_CI_VERSION_NAME}"
          gh release create "$TAG"             "Expanda-Personal.apk#Expanda Personal APK"             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "Expanda Personal ${EXPANDA_CI_VERSION_NAME}"             --notes "Signed personal build from custom-development. Version code: ${EXPANDA_CI_VERSION_CODE}. Commit: ${GITHUB_SHA}."
